spring.application.name=calorietrack-backend
server.port=8080

# File-backed H2: data survives application restarts.
spring.datasource.url=jdbc:h2:file:./data/calorietrack;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Replace for local use. Never commit a real key.
usda.api-key=DEMO_KEY

# Change this for anything beyond local development.
app.jwt-secret=change-this-development-secret-key-change-this-development-secret
app.jwt-expiration-ms=86400000

# For React connect
app.cors.allowed-origin=http://localhost:5173